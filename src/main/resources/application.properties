# Nombre del microservicio
spring.application.name=venta

# Puerto donde corre el servicio
server.port=8083

# Configuración conexión DB (variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Estrategia de creación de tablas
# create: borra y crea todo al iniciar (solo desarrollo)
# update: modifica tablas sin borrar (mejor para desarrollo avanzado)
# validate: solo valida estructura, no crea ni modifica
spring.jpa.hibernate.ddl-auto=create

# Mostrar sentencias SQL en consola (útil para debug)
spring.jpa.show-sql=true

# Formato legible para las sentencias SQL
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect